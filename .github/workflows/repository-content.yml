name: Repository content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject generated artifacts and videos in history
        run: python3 scripts/check-repository-content.py --history HEAD
      - name: Test content guard
        run: python3 -m unittest discover -s scripts -p 'test_repository_content.py'
